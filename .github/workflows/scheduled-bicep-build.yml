name: Unit Tests - Scheduled Bicep Build

on:
  schedule:
    - cron: "0 8 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  bicep_unit_tests:
    name: Bicep Build & Lint All Modules
    if: github.repository == 'Azure/ALZ-Bicep'
    permissions:
      issues: write
    runs-on: ubuntu-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: List Currently Installed Bicep Version
        shell: pwsh
        run: |
          $bicepVersion = bicep --version
          Write-Information "=====> Currently installed Bicep version is: $bicepVersion <=====" -InformationAction Continue

      - name: Install latest version of Bicep
        shell: sh
        run: |
          # From https://docs.microsoft.com/en-us/azure/azure-resource-manager/bicep/install#linux
          # Fetch the latest Bicep CLI binary
          curl -Lo bicep https://github.com/Azure/bicep/releases/latest/download/bicep-linux-x64
          # Mark it as executable
          chmod +x ./bicep
          # Add bicep to your PATH (requires admin)
          sudo mv ./bicep /usr/local/bin/bicep
          # Verify you can now access the 'bicep' command
          bicep --help
          # Done!

      - name: List Now Installed Bicep Version
        shell: pwsh
        run: |
          $bicepVersion = bicep --version
          Write-Information "=====> Now installed Bicep version is: $bicepVersion <=====" -InformationAction Continue

      - name: Bicep Build & Lint All Modules
        shell: pwsh
        run: |
          function Assert-HealthModelEmbeddedPolicyTemplates {
            function Get-CopyBlockCount {
              param (
                [Parameter(Mandatory = $false)]
                [object] $Node
              )

              if ($null -eq $Node) {
                return 0
              }

              if ($Node -is [System.Collections.IDictionary]) {
                $count = 0
                foreach ($key in $Node.Keys) {
                  if ($key -eq 'copy') {
                    $count++
                  }
                  $count += Get-CopyBlockCount -Node $Node[$key]
                }
                return $count
              }

              if ($Node -is [psobject] -and $Node -isnot [string]) {
                $count = 0
                foreach ($property in $Node.PSObject.Properties) {
                  if ($property.Name -eq 'copy') {
                    $count++
                  }
                  $count += Get-CopyBlockCount -Node $property.Value
                }
                return $count
              }

              if ($Node -is [System.Collections.IEnumerable] -and $Node -isnot [string]) {
                $count = 0
                foreach ($item in $Node) {
                  $count += Get-CopyBlockCount -Node $item
                }
                return $count
              }

              return 0
            }

            $scratchRoot = Join-Path (Get-Location) '.bicep-build-output/healthModel'
            if (Test-Path $scratchRoot) { Remove-Item -Recurse -Force $scratchRoot }
            New-Item -ItemType Directory -Force -Path $scratchRoot | Out-Null
            try {
              $embedded = @{
                'infra-as-code/bicep/modules/policy/healthModel/healthModelPlatformTopology.bicep'    = 'infra-as-code/bicep/modules/policy/healthModel/policy_healthModelPlatformTopology.json'
                'infra-as-code/bicep/modules/policy/healthModel/healthModelApplicationTopology.bicep' = 'infra-as-code/bicep/modules/policy/healthModel/policy_healthModelApplicationTopology.json'
              }
              foreach ($source in $embedded.Keys) {
                $artifact = $embedded[$source]
                $scratch = Join-Path $scratchRoot ([System.IO.Path]::GetFileName($artifact))
                Write-Information "==> Rebuilding embedded template for: $source" -InformationAction Continue
                bicep build $source --outfile $scratch
                if ($LastExitCode -ne 0) { throw "Bicep build failed for $source" }
                $expected = Get-Content -Raw -Path $artifact
                $actual = Get-Content -Raw -Path $scratch
                if ($expected -ne $actual) {
                  throw "Embedded policy template artifact is out of date: $artifact"
                }
              }

              $definitionModule = 'infra-as-code/bicep/modules/policy/healthModel/healthModelPolicyDefinitions.bicep'
              Write-Information "==> Verifying embedded templates in: $definitionModule" -InformationAction Continue
              $compiledDefinitions = bicep build $definitionModule --stdout | ConvertFrom-Json -Depth 100
              if ($LastExitCode -ne 0) { throw "Bicep build failed for $definitionModule" }
              $compiledDefinitionsText = $compiledDefinitions | ConvertTo-Json -Depth 100
              if ($compiledDefinitionsText -match "\[\[\[") {
                throw "Embedded policy template ARM parameter references were over-escaped in $definitionModule"
              }
              if ($compiledDefinitionsText -match "\[string\('copy'\)\]") {
                throw "Embedded policy template copy blocks were escaped in $definitionModule"
              }

              $standalonePolicyModules = @{
                'varPlatformPolicyDefinitionProperties'     = 'infra-as-code/bicep/modules/policy/healthModel/healthModelPolicy.bicep'
                'varApplicationPolicyDefinitionProperties'  = 'infra-as-code/bicep/modules/policy/healthModel/applicationHealthModelPolicy.bicep'
              }
              foreach ($artifact in $embedded.Values) {
                $topologyTemplate = Get-Content -Raw -Path $artifact | ConvertFrom-Json -Depth 100
                $copyCount = Get-CopyBlockCount -Node $topologyTemplate
                if ($copyCount -ne 4) {
                  throw "Expected exactly four copy blocks in $artifact, found $copyCount"
                }
              }
              foreach ($policyVarName in $standalonePolicyModules.Keys) {
                $standaloneModule = $standalonePolicyModules[$policyVarName]
                Write-Information "==> Verifying policy rule drift for: $standaloneModule" -InformationAction Continue
                $compiledStandalone = bicep build $standaloneModule --stdout | ConvertFrom-Json -Depth 100
                if ($LastExitCode -ne 0) { throw "Bicep build failed for $standaloneModule" }
                $definitionRule = $compiledDefinitions.variables.$policyVarName.policyRule | ConvertTo-Json -Depth 100
                $standaloneRule = $compiledStandalone.variables.$policyVarName.policyRule | ConvertTo-Json -Depth 100
                if ($definitionRule -ne $standaloneRule) {
                  throw "Policy rule drift detected between $definitionModule and $standaloneModule"
                }
              }
              Write-Information '==> Embedded policy templates are in sync.' -InformationAction Continue
            }
            finally {
              if (Test-Path $scratchRoot) { Remove-Item -Recurse -Force $scratchRoot }
            }
          }

          Assert-HealthModelEmbeddedPolicyTemplates

          $output = @()
          Get-ChildItem -Recurse -Filter '*.bicep' -Exclude 'callModuleFromACR.example.bicep','orchHubSpoke.bicep' | ForEach-Object {
              Write-Information "==> Attempting Bicep Build For File: $_" -InformationAction Continue
              $bicepOutput = bicep build $_.FullName 2>&1
              if ($LastExitCode -ne 0)
              {
                foreach ($item in $bicepOutput) {
                  $output += "$($item) `r`n"
                }
              }
              Else
              {
                echo "Bicep Build Successful for File: $_"
              }
          }
          if ($output.length -gt 0) {
            throw $output
          }

      - name: Create GitHub Issue with Bicep Build & Lint Fails
        if: ${{ failure() }}
        run: |
          gh issue create --title "Daily Bicep Build & Lint Worklfow Failed " --body "Check the latest run of the Daily Bicep Build & Lint Worklfow for details in the Actions tab."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
